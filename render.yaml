# SafeRoute - Render Blueprint Deployment Specification
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: saferoute-db
    databaseName: saferoute
    user: saferoute
    plan: free # Note: Render free databases expire in 30 days. For production, consider Starter or an external DB like Supabase/Neon.
    region: oregon

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend API
  # ---------------------------------------------------------------------------
  - type: web
    name: saferoute-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m app.db.init_postgis && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saferoute-db
          property: connectionString
      - key: APP_NAME
        value: SafeRoute
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ROUTING_PROVIDER
        value: stub
      - key: CORS_ORIGINS
        value: https://saferoute-frontend.onrender.com,http://localhost:5173
      - key: PYTHON_VERSION
        value: 3.11.9

  # ---------------------------------------------------------------------------
  # 2. React + Vite Frontend (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: saferoute-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://saferoute-backend.onrender.com/api/v1
      - key: VITE_GEOCODING_ENDPOINT
        value: https://photon.komoot.io/api/
      - key: VITE_ROUTING_ENDPOINT
        value: https://router.project-osrm.org/route/v1/driving
      # Optional: public frontend origin used for SMS tracking links.
      # Set this to the deployed frontend URL so phones don't receive localhost links.
      # - key: VITE_PUBLIC_APP_ORIGIN
      #   value: https://saferoute-frontend.onrender.com
